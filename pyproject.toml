[project]
name        = "KeeneticPy"
version     = "3.0.0"
description = "Modern Python Library and CLI for Keenetic Routers (KeeneticOS RCI)"
keywords    = ["KeeneticPy", "Keenetic", "router", "rci", "wireguard", "bgp", "KekikAkademi", "keyiflerolsun"]
license     = { text = "GPLv3+" }
readme      = "README.md"

authors = [
    { name = "keyiflerolsun", email = "keyiflerolsun@gmail.com" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3"
]

requires-python = ">=3.10"
dependencies    = [
    "httpx>=0.25.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[dependency-groups]
dev = [
    "pytest"
]

[project.scripts]
keenetic = "KeeneticPy.CLI:main"

[project.urls]
Homepage   = "https://github.com/keyiflerolsun/KeeneticPy"
Repository = "https://github.com/keyiflerolsun/KeeneticPy.git"
Issues     = "https://github.com/keyiflerolsun/KeeneticPy/issues"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["KeeneticPy"]
